# Glossary

| Term | Meaning |
|---|---|
| Data contract | Agreement between data producer and consumers covering schema, meaning, quality, SLA, ownership and access |
| Data steward | Person accountable for the quality and definitions of a domain's data |
| Grain | What one row in a table represents |
| Medallion architecture | Bronze (raw), Silver (cleaned and conformed), Gold (business-ready) |
| Unity Catalog | Databricks governance layer: access, lineage, discovery, quality monitoring |
| Expectation | Pipeline DQ rule with an action: warn, drop row, or fail |
| Security master | Golden record of every instrument, keyed by ISIN |
| Position | What a portfolio holds at a point in time |
| Transaction | A trade that changes a position |
| Clean price | Bond price excluding accrued interest |
| Accrued interest | Interest earned since the last coupon payment |
| Source-to-target mapping | Document mapping each source field to its target field with transformation rules |
